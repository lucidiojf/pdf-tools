<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Unir Fotos na Vertical</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    button { padding: 10px 16px; margin-top: 10px; cursor: pointer; }
    canvas { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <h3>Unir Fotos na Vertical</h3>
  <input type="file" id="fileInput" multiple accept="image/*"><br>
  <button onclick="mesclarFotos()">Gerar Imagem Única</button>
  <br>
  <a id="downloadLink" style="display:none; margin-top:10px; font-weight:bold;">Baixar Imagem Final</a>
  <canvas id="canvas"></canvas>

  <script>
    async function mesclarFotos() {
      const files = Array.from(document.getElementById('fileInput').files);
      if (!files.length) return alert('Selecione pelo menos uma foto.');

      const imagens = await Promise.all(files.map(file => new Promise(res => {
        const img = new Image();
        img.onload = () => res(img);
        img.src = URL.createObjectURL(file);
      })));

      // Ajusta todas para a largura da maior imagem
      const larguraMaxima = Math.max(...imagens.map(img => img.naturalWidth));
      let alturaTotal = 0;
      
      const redimensionadas = imagens.map(img => {
        const proporcao = larguraMaxima / img.naturalWidth;
        const altura = img.naturalHeight * proporcao;
        alturaTotal += altura;
        return { img, altura };
      });

      const canvas = document.getElementById('canvas');
      canvas.width = larguraMaxima;
      canvas.height = alturaTotal;
      const ctx = canvas.getContext('2d');

      let yAtual = 0;
      redimensionadas.forEach(({ img, altura }) => {
        ctx.drawImage(img, 0, yAtual, larguraMaxima, altura);
        yAtual += altura;
      });

      canvas.style.display = 'block';
      const link = document.getElementById('downloadLink');
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.download = 'fotos_unidas.jpg';
      link.textContent = 'Baixar JPG Unificado';
      link.style.display = 'inline-block';
    }
  </script>
</body>
</html>
