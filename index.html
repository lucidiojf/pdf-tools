<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramentas PDF</title>

  <!-- CDNs com fallback automático para nunca dar 'PDFLib is not defined' -->
  <script src="pdf-lib.min.js"></script>
    if (typeof PDFLib === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.9/pdf-lib.min.js"><\/script>');
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; padding: 20px 14px; margin: 0; }
    .card { background: #ffffff; width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0f172a; text-align: center; font-size: 1.3rem; }

    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
    .tab-btn {
      flex: 1; padding: 10px 6px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px;
      font-weight: 600; font-size: 0.82rem; cursor: pointer; color: #334155; white-space: nowrap;
    }
    .tab-btn.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }

    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 0.85rem; }
    input[type="file"], input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;
    }

    button.action {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; color: white; cursor: pointer;
    }
    .btn-blue { background: #2563eb; }
    .btn-dark { background: #334155; }
    .btn-green { background: #16a34a; }
    .btn-orange { background: #ea580c; }
    button.action:hover { opacity: 0.9; }

    #status { margin-top: 14px; padding: 12px; border-radius: 6px; font-size: 0.88rem; display: none; text-align: center; }
    .status-ok { background: #dcfce7; color: #15803d; }
    .status-err { background: #fee2e2; color: #b91c1c; }

    /* Caixa que aparece no celular para nunca perder o arquivo baixado */
    #download-box {
      display: none; margin-top: 14px; padding: 14px; border: 2px dashed #2563eb;
      background: #eff6ff; border-radius: 8px; text-align: center;
    }
    #download-box a {
      display: inline-block; margin-top: 8px; padding: 10px 16px; background: #2563eb;
      color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🛠️ Ferramentas PDF</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'tab-unlock')">🔓 Desbloquear</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-merge')">📑 Juntar</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-split')">✂️ Dividir</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-lock')">🔒 Proteger</button>
  </div>

  <!-- 1. UNLOCK -->
  <div id="tab-unlock" class="panel active">
    <div class="field">
      <label>Arquivo PDF protegido:</label>
      <input type="file" id="unlock-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Senha do PDF (deixe em branco se for só restrição):</label>
      <input type="password" id="unlock-pass" placeholder="Digite a senha...">
    </div>
    <button class="action btn-blue" onclick="execUnlock()">Desbloquear PDF</button>
  </div>

  <!-- 2. MERGE -->
  <div id="tab-merge" class="panel">
    <div class="field">
      <label>Selecione 2 ou mais PDFs:</label>
      <input type="file" id="merge-files" accept="application/pdf" multiple>
    </div>
    <button class="action btn-green" onclick="execMerge()">Juntar PDFs</button>
  </div>

  <!-- 3. SPLIT -->
  <div id="tab-split" class="panel">
    <div class="field">
      <label>Arquivo PDF:</label>
      <input type="file" id="split-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Páginas que deseja (ex: 1-3 ou 2,4):</label>
      <input type="text" id="split-pages" placeholder="Ex: 1-2, 4">
    </div>
    <button class="action btn-orange" onclick="execSplit()">Extrair Páginas</button>
  </div>

  <!-- 4. LOCK -->
  <div id="tab-lock" class="panel">
    <div class="field">
      <label>Arquivo PDF:</label>
      <input type="file" id="lock-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Crie uma senha:</label>
      <input type="password" id="lock-pass" placeholder="Nova senha...">
    </div>
    <button class="action btn-dark" onclick="execLock()">Proteger com Senha</button>
  </div>

  <div id="status"></div>

  <!-- Botão fixo visível pós-processamento -->
  <div id="download-box">
    <span id="download-text">Seu arquivo está pronto!</span><br>
    <a id="download-link" href="#" target="_blank" download="arquivo.pdf">📥 Baixar / Abrir Arquivo</a>
  </div>
</div>

<script>
  function openTab(evt, tabId) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    evt.currentTarget.classList.add('active');
    document.getElementById('status').style.display = 'none';
    document.getElementById('download-box').style.display = 'none';
  }

  function msg(texto, sucesso = true) {
    const el = document.getElementById('status');
    el.style.display = 'block';
    el.className = sucesso ? 'status-ok' : 'status-err';
    el.innerText = texto;
  }

  function checkLib() {
    if (typeof PDFLib === 'undefined') {
      msg('❌ Erro: O script da biblioteca PDF ainda não carregou. Verifique sua conexão com a internet e recarregue a página.', false);
      return false;
    }
    return true;
  }

  // Entrega o arquivo garantindo acesso tanto no PC quanto no Celular
  async function entregarArquivo(bytes, nomeArquivo) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    // 1. Atualiza e exibe o botão visível na tela
    const box = document.getElementById('download-box');
    const link = document.getElementById('download-link');
    link.href = url;
    link.download = nomeArquivo;
    link.innerText = `📥 Baixar ${nomeArquivo}`;
    box.style.display = 'block';

    // 2. No celular, se o navegador permitir, abre a folha nativa (WhatsApp, Salvar em Arquivos, Drive)
    if (navigator.canShare && navigator.canShare({ files: [new File([blob], nomeArquivo, { type: 'application/pdf' })] })) {
      try {
        const file = new File([blob], nomeArquivo, { type: 'application/pdf' });
        await navigator.share({
          files: [file],
          title: nomeArquivo,
        });
        msg('✅ Arquivo pronto e compartilhado!');
        return;
      } catch (err) {
        // Se o usuário fechar a tela de compartilhamento, segue o fluxo normal
      }
    }

    // 3. Fallback: disparo de download tradicional
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    msg('✅ Concluído! Se o download não começou sozinho, clique no botão azul abaixo.');
  }

  // --- UNLOCK ---
  async function execUnlock() {
    if (!checkLib()) return;
    const input = document.getElementById('unlock-file');
    const pass = document.getElementById('unlock-pass').value;
    if (!input.files.length) return msg('Selecione um arquivo PDF primeiro.', false);

    try {
      msg('Processando...');
      const buffer = await input.files[0].arrayBuffer();
      const pdf = await PDFLib.PDFDocument.load(buffer, { password: pass || undefined, ignoreEncryption: false });
      const bytes = await pdf.save();
      await entregarArquivo(bytes, 'desbloqueado_' + input.files[0].name);
    } catch (e) {
      msg('❌ Erro: Senha incorreta ou formato não suportado.', false);
    }
  }

  // --- MERGE ---
  async function execMerge() {
    if (!checkLib()) return;
    const input = document.getElementById('merge-files');
    if (input.files.length < 2) return msg('Selecione pelo menos 2 arquivos para juntar.', false);

    try {
      msg('Unindo arquivos...');
      const mergedPdf = await PDFLib.PDFDocument.create();

      for (let file of input.files) {
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(buffer);
        const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        pages.forEach(p => mergedPdf.addPage(p));
      }

      const bytes = await mergedPdf.save();
      await entregarArquivo(bytes, 'documentos_juntos.pdf');
    } catch (e) {
      msg('❌ Erro ao unir arquivos: ' + e.message, false);
    }
  }

  // --- SPLIT ---
  async function execSplit() {
    if (!checkLib()) return;
    const input = document.getElementById('split-file');
    const range = document.getElementById('split-pages').value.trim();
    if (!input.files.length || !range) return msg('Selecione o arquivo e defina as páginas.', false);

    try {
      msg('Extraindo páginas...');
      const buffer = await input.files[0].arrayBuffer();
      const srcPdf = await PDFLib.PDFDocument.load(buffer);
      const total = srcPdf.getPageCount();
      const indices = new Set();

      range.split(',').forEach(part => {
        part = part.trim();
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(n => parseInt(n.trim(), 10));
          for (let i = start; i <= end; i++) {
            if (i >= 1 && i <= total) indices.add(i - 1);
          }
        } else {
          const p = parseInt(part, 10);
          if (p >= 1 && p <= total) indices.add(p - 1);
        }
      });

      if (indices.size === 0) return msg('Nenhuma página válida encontrada nesse intervalo.', false);

      const newPdf = await PDFLib.PDFDocument.create();
      const pages = await newPdf.copyPages(srcPdf, Array.from(indices));
      pages.forEach(p => newPdf.addPage(p));

      const bytes = await newPdf.save();
      await entregarArquivo(bytes, 'extraido_' + input.files[0].name);
    } catch (e) {
      msg('❌ Erro ao extrair páginas: ' + e.message, false);
    }
  }

  // --- LOCK ---
  async function execLock() {
    if (!checkLib()) return;
    const input = document.getElementById('lock-file');
    const pass = document.getElementById('lock-pass').value;
    if (!input.files.length || !pass) return msg('Selecione o arquivo e defina uma senha.', false);

    try {
      msg('Criptografando...');
      const buffer = await input.files[0].arrayBuffer();
      const pdf = await PDFLib.PDFDocument.load(buffer);
      await pdf.encrypt({ userPassword: pass, ownerPassword: pass });
      const bytes = await pdf.save();
      await entregarArquivo(bytes, 'protegido_' + input.files[0].name);
    } catch (e) {
      msg('❌ Erro ao proteger: ' + e.message, false);
    }
  }
</script>

</body>
</html>
